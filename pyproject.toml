[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trap-lab"
version = "0.1.0"
description = "AI agent trap simulator and detector based on Franklin et al. (2026) taxonomy"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "stegoff",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
py-modules = ["lab"]
packages = ["traps", "agent", "detectors"]

[project.scripts]
traplab = "lab:cli"
